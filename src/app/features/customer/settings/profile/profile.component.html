<div class="settings-section">
  <div class="section-header">
    <h2 class="section-title">Profile</h2>
    <p class="section-desc">Manage your personal information and profile picture.</p>
  </div>

  <nz-divider></nz-divider>

  <!-- Avatar -->
  <div class="avatar-row">
    <nz-avatar [nzSize]="72" nzIcon="user" [nzSrc]="user()?.photoURL" nzAlt="Your profile picture"></nz-avatar>
    <div class="avatar-info">
      <p class="avatar-label">Profile Picture</p>
      <div class="avatar-actions">
        <input
          #photoInput
          type="file"
          class="avatar-file"
          accept="image/jpeg,image/png,image/webp"
          (change)="onPhotoSelected($event)"
        />
        <button nz-button nzType="default" nzSize="small" [nzLoading]="photoBusy()" (click)="photoInput.click()">
          <span nz-icon nzType="upload"></span> {{ user()?.photoURL ? 'Change Photo' : 'Upload Photo' }}
        </button>
        @if (user()?.photoURL) {
          <button nz-button nzType="default" nzDanger nzSize="small" [disabled]="photoBusy()" (click)="removePhoto()">
            Remove
          </button>
        }
      </div>
      <p class="avatar-hint">JPG, PNG or WebP · Max 5 MB · Cropped to a square automatically</p>
    </div>
  </div>

  <nz-divider></nz-divider>

  <!-- Form -->
  <form nz-form [nzLayout]="'vertical'" class="profile-form">
    <nz-form-item>
      <nz-form-label nzRequired>Full Name</nz-form-label>
      <nz-form-control
        [nzValidateStatus]="submitted() && nameError() ? 'error' : ''"
        [nzErrorTip]="submitted() ? (nameError() ?? '') : ''"
      >
        <input nz-input [ngModel]="name()" (ngModelChange)="name.set($event)" name="name" placeholder="Your full name" maxlength="60" autocomplete="name" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label>Email Address</nz-form-label>
      <nz-form-control nzExtra="This is your sign-in email and can't be changed here.">
        <input nz-input [ngModel]="email()" name="email" type="email" readonly />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label>Phone Number</nz-form-label>
      <!-- A number still being typed is only flagged once it has all 11 digits or the user tries to save. -->
      <nz-form-control
        [nzValidateStatus]="phoneError() && (submitted() || phone().length >= 11) ? 'error' : ''"
        [nzErrorTip]="phoneError() ?? ''"
      >
        <input nz-input appMobileInput [ngModel]="phone()" (ngModelChange)="phone.set($event)" name="phone" placeholder="09171234567" autocomplete="tel" />
      </nz-form-control>
    </nz-form-item>

    <div class="form-row">
      <nz-form-item class="form-col">
        <nz-form-label>Gender</nz-form-label>
        <nz-form-control>
          <nz-select [ngModel]="gender()" (ngModelChange)="gender.set($event)" name="gender" nzPlaceHolder="Select gender" nzAllowClear>
            @for (g of genders; track g.value) {
              <nz-option [nzValue]="g.value" [nzLabel]="g.label"></nz-option>
            }
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item class="form-col">
        <nz-form-label>Date of Birth</nz-form-label>
        <nz-form-control>
          <nz-date-picker
            class="full-width"
            [ngModel]="dateOfBirth()"
            (ngModelChange)="dateOfBirth.set($event)"
            name="dateOfBirth"
            nzPlaceHolder="Select date"
            nzFormat="MMM d, yyyy"
            [nzDisabledDate]="disabledBirthDate"
          />
        </nz-form-control>
      </nz-form-item>
    </div>

    <nz-form-item>
      <nz-form-label>Bio</nz-form-label>
      <nz-form-control [nzValidateStatus]="bioError() ? 'error' : ''" [nzErrorTip]="bioError() ?? ''">
        <textarea nz-input [ngModel]="bio()" (ngModelChange)="bio.set($event)" name="bio" placeholder="Tell us a little about yourself…" [maxlength]="bioMaxLength" [nzAutosize]="{ minRows: 3, maxRows: 5 }"></textarea>
      </nz-form-control>
    </nz-form-item>

    <div class="form-actions">
      <button nz-button nzType="primary" [nzLoading]="saving()" (click)="save()">Save Changes</button>
    </div>
  </form>
</div>
