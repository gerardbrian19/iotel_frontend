<div class="settings-section">
  <div class="section-header">
    <h2 class="section-title">Profile</h2>
    <p class="section-desc">Manage your personal information and profile picture.</p>
  </div>

  <nz-divider></nz-divider>

  <!-- Avatar -->
  <div class="avatar-row">
    <nz-avatar [nzSize]="72" nzIcon="user" [nzSrc]="user()?.photoURL" nzAlt="Your profile picture"></nz-avatar>
    <div class="avatar-info">
      <p class="avatar-label">Profile Picture</p>
      <div class="avatar-actions">
        <input
          #photoInput
          type="file"
          class="avatar-file"
          accept="image/jpeg,image/png,image/webp"
          (change)="onPhotoSelected($event)"
        />
        <button nz-button nzType="default" nzSize="small" [nzLoading]="photoBusy()" (click)="photoInput.click()">
          <span nz-icon nzType="upload"></span> {{ user()?.photoURL ? 'Change Photo' : 'Upload Photo' }}
        </button>
        @if (user()?.photoURL) {
          <button nz-button nzType="default" nzDanger nzSize="small" [disabled]="photoBusy()" (click)="removePhoto()">
            Remove
          </button>
        }
      </div>
      <p class="avatar-hint">JPG, PNG or WebP · Max 5 MB · Cropped to a square automatically</p>
    </div>
  </div>

  <nz-divider></nz-divider>

  <!-- Form -->
  <form nz-form [nzLayout]="'vertical'" class="profile-form">
    <nz-form-item>
      <nz-form-label>Full Name</nz-form-label>
      <nz-form-control>
        <input nz-input [ngModel]="name()" (ngModelChange)="name.set($event)" name="name" placeholder="Your full name" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label>Email Address</nz-form-label>
      <nz-form-control>
        <input nz-input [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" placeholder="your@email.com" type="email" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label>Phone Number</nz-form-label>
      <nz-form-control>
        <input nz-input [ngModel]="phone()" (ngModelChange)="phone.set($event)" name="phone" placeholder="+63 9XX XXX XXXX" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label>Bio</nz-form-label>
      <nz-form-control>
        <textarea nz-input [ngModel]="bio()" (ngModelChange)="bio.set($event)" name="bio" placeholder="Tell us a little about yourself…" [nzAutosize]="{ minRows: 3, maxRows: 5 }"></textarea>
      </nz-form-control>
    </nz-form-item>

    <div class="form-actions">
      <button nz-button nzType="primary" [nzLoading]="saving()" (click)="save()">Save Changes</button>
    </div>
  </form>
</div>
