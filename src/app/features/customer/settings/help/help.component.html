<div class="settings-section">
  <div class="section-header">
    <h2 class="section-title">Help Centre</h2>
    <p class="section-desc">Find answers, contact support, and review legal documents.</p>
  </div>

  <nz-divider></nz-divider>

  <div class="help-grid">
    @for (item of helpItems; track item.title) {
      <div class="help-card">
        <span nz-icon [nzType]="item.icon" class="help-icon"></span>
        <div class="help-text">
          <p class="help-title">{{ item.title }}</p>
          <p class="help-desc">{{ item.desc }}</p>
        </div>
        <span nz-icon nzType="right" class="help-arrow"></span>
      </div>
    }
  </div>
</div>
