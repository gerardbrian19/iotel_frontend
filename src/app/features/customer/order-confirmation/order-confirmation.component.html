<div class="confirmation-page">
  @if (order(); as order) {
    <div class="confirmation-container">
      <nz-result
        [nzStatus]="order.status === 'Cancelled' ? 'info' : 'success'"
        [nzTitle]="
          order.status === 'Pending' ? 'Order Placed Successfully!' : 'Order ' + order.status
        "
        [nzSubTitle]="'Order ' + order.code"
      >
        <div nz-result-extra>
          <a routerLink="/customer/orders" nz-button nzType="primary" class="track-btn">
            <span nz-icon nzType="environment"></span> Track My Order
          </a>
          <a routerLink="/customer/catalog" nz-button>Continue Shopping</a>
        </div>
      </nz-result>

      <nz-card class="detail-card">
        <div class="meta-grid">
          <div class="meta-item">
            <span class="meta-label">Order</span>
            <span class="meta-value">{{ order.code }}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Date Placed</span>
            <span class="meta-value">{{ order.createdAt | date: 'mediumDate' }}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Status</span>
            <nz-tag [nzColor]="statusColors[order.status]">{{ order.status }}</nz-tag>
          </div>
        </div>
        <app-order-actions class="actions" [order]="order" />
      </nz-card>

      <nz-card class="detail-card" nzTitle="Order Details">
        <app-order-detail [order]="order" />
      </nz-card>
    </div>
  } @else if (loading()) {
    <div class="loading-state">
      <nz-spin nzSimple nzSize="large" />
    </div>
  } @else {
    <div class="confirmation-container">
      <nz-result
        nzStatus="404"
        nzTitle="Order not found"
        nzSubTitle="This order doesn't exist or isn't on your account."
      >
        <div nz-result-extra>
          <a routerLink="/customer/orders" nz-button nzType="primary" class="track-btn"
            >My Orders</a
          >
        </div>
      </nz-result>
    </div>
  }
</div>
