<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <div class="brand-logo">
        <span class="logo-text">IOTEL</span>
        <span class="logo-sub">by Goldcomm</span>
      </div>
    </div>

    <h2 class="login-title">Reset your password</h2>

    @if (sent()) {
      <nz-alert
        nzType="success"
        nzShowIcon
        class="mb-4"
        nzMessage="If an account exists for that email, we've sent a link to reset the password. Check your inbox and spam folder."
      />
    } @else {
      <p class="switch-auth mb-4">
        Enter your account's email and we'll send you a link to set a new password.
      </p>
    }

    @if (error()) {
      <nz-alert nzType="error" [nzMessage]="error()!" nzShowIcon class="mb-4" />
    }

    <form nz-form [formGroup]="form" (ngSubmit)="submit()" nzLayout="vertical">
      <nz-form-item>
        <nz-form-label nzRequired>Email</nz-form-label>
        <nz-form-control [nzErrorTip]="emailErrors">
          <nz-input-group nzPrefixIcon="mail">
            <input
              nz-input
              type="email"
              placeholder="you@example.com"
              formControlName="email"
              autocomplete="email"
              maxlength="254"
            />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <ng-template #emailErrors let-control>
        @if (control.hasError('required')) {
          Please enter your email
        } @else {
          Please enter a valid email address
        }
      </ng-template>

      <button
        nz-button
        nzType="primary"
        nzBlock
        type="submit"
        class="login-btn"
        [nzLoading]="loading()"
        [disabled]="resendIn() > 0"
      >
        @if (resendIn() > 0) {
          Send again in {{ resendIn() }}s
        } @else if (sent()) {
          Send again
        } @else {
          Send reset link
        }
      </button>
    </form>

    <p class="switch-auth">
      <a routerLink="/auth/login" [queryParams]="{ email: null }" queryParamsHandling="merge"
        >Back to sign in</a
      >
    </p>
  </div>
</div>
