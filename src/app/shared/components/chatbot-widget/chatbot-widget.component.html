@if (isOpen()) {
  <div class="chat-panel">
    <div class="chat-header">
      <div class="chat-title">
        <span class="bot-icon">🤖</span>
        IOTEL Assistant
      </div>
      <button class="close-btn" (click)="toggle()">✕</button>
    </div>
    <div class="chat-messages" #scrollContainer>
      @for (msg of messages(); track $index) {
        <div class="message" [class.user-msg]="msg.from === 'user'" [class.bot-msg]="msg.from === 'bot'">
          {{ msg.text }}
        </div>
      }
    </div>
    <div class="chat-footer">
      <input
        class="chat-input"
        type="text"
        placeholder="Type a message..."
        [(ngModel)]="inputText"
        (keydown)="onKeydown($event)"
      />
      <button class="send-btn" (click)="send()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
        </svg>
      </button>
    </div>
    <div class="chat-escalate">
      Need a human? <a routerLink="/customer/messages">Talk to Support</a>
    </div>
  </div>
}

<button class="fab" (click)="toggle()" [class.open]="isOpen()">
  @if (isOpen()) {
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
  } @else {
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
  }
</button>
